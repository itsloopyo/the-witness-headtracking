name: Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package
    runs-on: windows-latest
    timeout-minutes: 30
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      # run-install stays off: the build uses the runner image's CMake and MSVC,
      # and `pixi run` installs the one pixi dependency, node, itself on the
      # first task it runs.
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          run-install: false

      # Build, test + package through the SAME command a developer runs
      # locally. All build logic lives in the pixi task chain (setup ->
      # build-release -> test -> package); the workflow owns none, so local and
      # CI can't drift.
      - name: Build, test and package
        shell: pwsh
        run: pixi run package

      - name: Conformance
        shell: pwsh
        run: pixi run conformance

      - name: Validate launcher manifest
        shell: pwsh
        run: pixi run validate-manifest

      # Otherwise notices drift is only caught at release time, so a submodule
      # bump merged through a PR ships stale attribution until then.
      - name: Validate third-party notices
        shell: pwsh
        run: pixi run validate-notices

      - name: Verify installer was produced
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter '*-installer.zip' | Select-Object -First 1
          if (-not $installer) { Write-Host "::error::No installer ZIP found"; exit 1 }
