name: Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'

jobs:
  build:
    name: Build and package
    runs-on: windows-latest
    timeout-minutes: 30
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      # run-install: false - this workspace has zero conda dependencies (pixi is
      # a task runner only; CMake and MSVC come from the runner image). The
      # action's post-install `pixi list` errors on an empty environment in
      # pixi 0.70+.
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          run-install: false

      # Build + package through the SAME command a developer runs locally. All
      # build logic lives in the pixi task chain (setup -> build-release ->
      # package); the workflow owns none, so local and CI can't drift.
      - name: Build and package
        shell: pwsh
        run: pixi run package

      # The characterization tests were compiled by the step above and never
      # run, so a failing assertion on the tracker-to-engine signs, the lean
      # basis, the zoom factor, the reticle solve or the ini guards shipped.
      # Same `pixi run` a developer uses; no build logic here.
      - name: Test
        shell: pwsh
        run: pixi run test

      - name: Conformance
        shell: pwsh
        run: pixi run conformance

      - name: Validate launcher manifest
        shell: pwsh
        run: pixi run validate-manifest

      # Otherwise notices drift is only caught at release time, so a submodule
      # bump merged through a PR ships stale attribution until then.
      - name: Validate third-party notices
        shell: pwsh
        run: pixi run validate-notices

      - name: Verify installer was produced
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter '*-installer.zip' | Select-Object -First 1
          if (-not $installer) { Write-Host "::error::No installer ZIP found"; exit 1 }
