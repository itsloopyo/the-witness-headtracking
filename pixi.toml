[workspace]
name = "the-witness-head-tracking"
version = "0.0.0"
description = "Head tracking mod for The Witness via OpenTrack UDP"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"

# No -G: let CMake auto-detect the installed Visual Studio generator. Pinning
# "Visual Studio 17 2022" broke on CI once the windows runner image moved to
# VS 2026 (VS 17 absent); auto-detect picks whatever VS the machine has.
setup = { cmd = """
    powershell -NoProfile -Command "if (-not (Test-Path 'build')) { cmake -B build -A x64 } else { Write-Host 'Build directory exists, skipping setup' -ForegroundColor Yellow }"
""" }

build         = { cmd = "cmake --build build --config Debug",   depends-on = ["setup"] }
build-release = { cmd = "cmake --build build --config Release", depends-on = ["setup"] }

# test-unit: the characterization tests, the frozen HeadTracking.ini reader's
# tests and the CameraUnlock.ini tests. test-differential: the config
# differential test, which holds that reader to the dev build's and the
# migration into CameraUnlock.ini to the reader, and core's canonical config
# lint over every file that test migrated.
test-unit = { cmd = "ctest --test-dir build -C Release --output-on-failure -LE differential", depends-on = ["build-release"] }
test-differential = { cmd = "ctest --test-dir build -C Release --output-on-failure --no-tests=error -L differential", depends-on = ["build-release"] }
test = { depends-on = ["test-unit", "test-differential"] }

# Rewrites HeadTracking.ini, the committed CameraUnlock.ini (the path core's
# data/config-format.json records), from the config table after a change to a
# row, a comment or a default, then writes the launcher manifest's config
# descriptor per_game from it. The canonical_config test fails until it has run.
render-config = { cmd = "build/Release/twht_canonical_config_tests.exe --render-config HeadTracking.ini && node cameraunlock-core/scripts/encode-seed.mjs", depends-on = ["build-release"] }

deploy  = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/deploy.ps1 Debug",   depends-on = ["build"] }
install = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/deploy.ps1 Release", depends-on = ["build-release"] }

detect-game = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/detect-game.ps1" }

# Shim-only mod: the DLL is itself the system-DLL proxy the game loads, so there
# is no vendored loader to refresh. Kept as a no-op for parity with the rest of
# the catalogue; nothing depends on it, here or anywhere else.
update-deps = "powershell -NoProfile -Command \"Write-Host 'No vendored dependencies to update (shim-only mod).'\""

uninstall     = { cmd = "cmd /c scripts\\uninstall.cmd" }
uninstall-all = { cmd = "cmd /c scripts\\uninstall.cmd --force" }

clean     = { cmd = """powershell -NoProfile -Command "if (Test-Path 'build')   { Remove-Item 'build'   -Recurse -Force }" """ }
clean-all = { cmd = """powershell -NoProfile -Command "if (Test-Path 'build')   { Remove-Item 'build'   -Recurse -Force }; if (Test-Path 'release') { Remove-Item 'release' -Recurse -Force }" """ }

# The fleet-wide gates: conformance covers the install wrapper, the CRLF
# endings, the action pins, the README rules and the canonical config, and
# validate-manifest covers launcher-manifest.json against the ZIP it describes.
conformance = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/conformance.ps1 -Repo ." }
validate-manifest = { cmd = "node cameraunlock-core/scripts/validate-manifest.mjs" }
validate-notices = { cmd = "node cameraunlock-core/scripts/validate-notices.mjs" }

# The nightly is reachable through `release nightly` as well; this is the name
# the fleet's tooling looks for.
release-nightly = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release-nightly.ps1" }

# Depends on test-unit, so no ZIP is built from a tree whose tests fail. The
# config differential test runs on the release paths.
package = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["build-release", "test-unit"] }
release = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release.ps1" }

[dependencies]
# The build uses the system CMake and Visual Studio. Packaging runs core's config
# descriptor check (Copy-SharedBundle) with node. Pinned to the release core's
# own lock resolves.
nodejs = "==26.5.0"
